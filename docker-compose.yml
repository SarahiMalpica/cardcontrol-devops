services:
  frontend:
    build: ./frontend
    container_name: cardcontrol_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/script.js:/usr/share/nginx/html/script.js:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: cardcontrol_backend
    command: flask --app app run --host=0.0.0.0 --port=5000 --debug
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MONGO_URI=mongodb+srv://sarahimalpica42_db_user:oso5007@cardcontrol.kece4yu.mongodb.net/?appName=cardcontrol
    volumes:
      - ./backend/app.py:/app/app.py
      - ./logs:/app/logs
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: cardcontrol_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
