version: "3.9"

services:
  frontend:
    build: ./frontend
    container_name: cardcontrol_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: cardcontrol_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: cardcontrol_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: