<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardControl Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>CardControl</h1>
      <p>Control de tarjetas</p>
    </header>

    <section class="panel add-panel">
      <h2>Agregar tarjeta</h2>
      <form id="cardForm" class="add-form">
        <input type="text" id="bank" placeholder="Banco" required>
        <input type="text" id="cardName" placeholder="Nombre de tarjeta" required>
        <input type="number" id="balance" placeholder="Limite" min="0" step="0.01" required>
        <button class="btn btn-primary" type="submit">Guardar tarjeta</button>
      </form>
      <p id="formMessage" class="meta"></p>
    </section>

    <section class="panel limits-panel">
      <h2>Tarjetas: limite</h2>
      <div id="limitsContainer" class="limits-grid"></div>
    </section>

    <section class="panel table-panel">
      <h2>Resumen general</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tarjeta</th>
              <th>Limite</th>
              <th>Disponible</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
          <tfoot>
            <tr>
              <td>Total</td>
              <td id="totalLimit">$0.00</td>
              <td id="totalAvailable">$0.00</td>
              <td>-</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
